<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Quest — Учебник и Решения</title>
<meta name="version" content="2.0">
<style>
:root {
  --bg:#0b0f19; --bg2:#141824; --bg3:#1a1f2e;
  --cyan:#00d4e8; --purple:#8b5cf6; --green:#00c896;
  --pink:#f472b6; --gold:#fbbf24; --text:#e2e8f0; --muted:#94a3b8;
  --border:rgba(0,212,232,.18); --glass:rgba(20,24,36,.92);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#1a1d2e 0%,#0b0f19 55%)}

.header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.2rem;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.84rem;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--cyan),#0891b2);color:#0b0f19}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,212,232,.35)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--cyan)}
.btn-ghost:hover{background:rgba(0,212,232,.08)}
.btn-sm{padding:5px 10px;font-size:.78rem}
.btn.active{background:rgba(0,212,232,.15);border-color:var(--cyan)}
.btn-present{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
.btn-present:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(139,92,246,.4)}

.layout{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.sidebar-head{padding:12px 14px;border-bottom:1px solid var(--border);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.module-list{flex:1;overflow-y:auto;padding:6px}
.mod-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:all .15s;margin-bottom:3px;border:1px solid transparent}
.mod-item:hover{background:rgba(0,212,232,.06);border-color:var(--border)}
.mod-item.active{background:rgba(0,212,232,.12);border-color:var(--cyan)}
.mod-num{width:26px;height:26px;border-radius:7px;background:rgba(139,92,246,.2);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0}
.mod-item.active .mod-num{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#0b0f19}
.mod-info{min-width:0}
.mod-name{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-theme{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;overflow-y:auto;padding:20px 24px;min-width:0}
.welcome{max-width:720px;margin:36px auto;text-align:center}
.welcome h1{font-size:1.9rem;margin-bottom:10px;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:var(--muted);line-height:1.55;margin-bottom:16px;font-size:.92rem}
.welcome-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:22px;text-align:left}
.w-card{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:14px;cursor:pointer;transition:all .2s}
.w-card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.w-card .emoji{font-size:1.35rem}.w-card h3{font-size:.9rem;margin:4px 0 2px}.w-card span{font-size:.72rem;color:var(--cyan)}

.mod-header{margin-bottom:14px}
.mod-header .badge{display:inline-block;background:linear-gradient(135deg,var(--purple),var(--pink));padding:2px 11px;border-radius:16px;font-size:.7rem;font-weight:600;margin-bottom:6px}
.mod-header h1{font-size:1.55rem;margin-bottom:2px}
.mod-header .sub{color:var(--muted);font-size:.9rem}

.tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px}
.tab{padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--muted);border:1px solid transparent;transition:all .15s}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab.active{color:var(--cyan);background:rgba(0,212,232,.1);border-color:var(--border)}

.panel{display:none;animation:fadeIn .2s ease}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.section{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.section h2{font-size:1.02rem;color:var(--cyan);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.section h3{font-size:.92rem;color:var(--gold);margin:12px 0 6px}
.section p,.section li{line-height:1.55;color:var(--text);font-size:.88rem}
.section ul,.section ol{padding-left:20px;margin:6px 0}
.section li{margin-bottom:4px}

/* Callout — без «Учитель говорит» */
.callout{border-left:3px solid var(--purple);background:rgba(139,92,246,.09);padding:12px 14px;border-radius:0 9px 9px 0;margin:10px 0;font-size:.88rem;line-height:1.5}
.callout.idea{border-left-color:var(--cyan);background:rgba(0,212,232,.07)}
.callout.warn{border-left-color:var(--gold);background:rgba(251,191,36,.08)}
.term{color:var(--cyan);font-weight:700}
.term-fn{color:#7dd3fc;font-weight:700;font-family:Consolas,Monaco,monospace}
.term-op{color:var(--pink);font-weight:700;font-family:Consolas,Monaco,monospace}
.term-type{color:var(--green);font-weight:700}
.term-kw{color:var(--gold);font-weight:700}
.term-err{color:#ff6b8a;font-weight:700}


.keywords{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.kw{background:rgba(0,212,232,.12);color:var(--cyan);padding:3px 9px;border-radius:14px;font-size:.74rem;font-weight:600}

.code-block{background:#0a0e14;border:1px solid rgba(0,212,232,.2);border-radius:9px;padding:12px 14px;margin:10px 0;font-family:Consolas,Monaco,monospace;font-size:.84rem;line-height:1.5;overflow-x:auto;color:#a5f3fc;position:relative;white-space:pre}
.code-block .label{position:absolute;top:5px;right:8px;font-size:.62rem;color:var(--muted);font-family:system-ui}

.plan-list{counter-reset:plan;list-style:none;padding:0}
.plan-list li{counter-increment:plan;display:flex;gap:10px;margin-bottom:7px;align-items:flex-start;font-size:.88rem}
.plan-list li::before{content:counter(plan);width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#0b0f19;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;flex-shrink:0}

.sol-card{background:var(--bg2);border:1px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden}
.sol-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer;gap:8px;flex-wrap:wrap}
.sol-head:hover{background:rgba(0,212,232,.04)}
.sol-title{font-weight:600;font-size:.88rem}
.sol-meta{font-size:.72rem;color:var(--muted)}
.diff{padding:2px 8px;border-radius:9px;font-size:.66rem;font-weight:700}
.diff.easy{background:rgba(0,200,150,.15);color:var(--green)}
.diff.medium{background:rgba(251,191,36,.15);color:var(--gold)}
.diff.hard{background:rgba(244,114,182,.15);color:var(--pink)}
.diff.boss{background:rgba(139,92,246,.2);color:var(--purple)}
.sol-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.sol-card.open .sol-body{display:block}
.sol-obj{font-size:.82rem;color:var(--muted);margin:8px 0 6px}
.sol-note{font-size:.8rem;color:var(--muted);margin-top:6px;line-height:1.45}

.footer-note{text-align:center;padding:16px;color:var(--muted);font-size:.74rem;border-top:1px solid var(--border);margin-top:24px}

/* ===== PRESENTATION MODE ===== */
#present-overlay{
  display:none;position:fixed;inset:0;z-index:9999;background:#0a0e16;
  color:var(--text);flex-direction:column;overflow:hidden;
}
#present-overlay.active{display:flex}
.present-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;background:rgba(0,0,0,.45);border-bottom:1px solid var(--border);flex-shrink:0;
}
.present-bar .title{font-weight:700;font-size:1rem}
/* Layout: theme full width; left = plan+keywords; right = conspect (wide) */
.present-body{
  flex:1;display:grid;
  grid-template-columns:minmax(260px,34%) 1fr;
  grid-template-rows:auto 1fr;
  gap:14px;padding:16px 20px;overflow:hidden;min-height:0;
}
.p-card{
  background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:14px 16px;
  overflow:hidden;display:flex;flex-direction:column;min-height:0;
}
.p-card h2{font-size:1rem;color:var(--cyan);margin-bottom:8px;flex-shrink:0}
.p-theme{grid-column:1/-1;padding:12px 18px}
.p-theme .theme-text{font-size:1.35rem;font-weight:700;line-height:1.3}
.p-left{
  grid-column:1;grid-row:2;
  display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden;
}
.p-left .p-card{flex:1;min-height:0}
.p-left .p-plan{flex:1.2}
.p-left .p-kw{flex:0.85}
.p-plan .plan-list{overflow-y:auto}
.p-plan .plan-list li{font-size:.92rem;margin-bottom:7px}
.p-plan .plan-list li::before{width:26px;height:26px;font-size:.72rem}
.p-kw .keywords{gap:7px;overflow-y:auto}
.p-kw .kw{font-size:.86rem;padding:5px 12px}
.p-conspect{
  grid-column:2;grid-row:2;
  overflow-y:auto;padding:16px 20px;
}
.p-conspect .text{font-size:1.08rem;line-height:1.6}
.p-conspect .callout{font-size:1.02rem;padding:14px 16px;margin:12px 0}
.p-conspect .code-block{font-size:.98rem;padding:14px 16px;margin:12px 0}
.p-conspect h3{font-size:1.08rem;margin:14px 0 8px;color:var(--gold)}
.p-conspect p{margin-bottom:8px}
.p-conspect .term,.p-conspect .term-fn,.p-conspect .term-op,.p-conspect .term-type,.p-conspect .term-kw,.p-conspect .term-err{font-size:1.05em}
@media(max-width:900px){
  .present-body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .p-left{grid-column:1;grid-row:2;max-height:38vh}
  .p-conspect{grid-column:1;grid-row:3}
}

@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{width:100%;max-height:180px;border-right:none;border-bottom:1px solid var(--border)}
  .main{padding:14px}
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,212,232,.25);border-radius:3px}
</style>
</head>
<body>

<header class="header">
  <div class="logo">📘 Python Quest · Учебник v2.0</div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="showWelcome()">🏠 Главная</button>
    <button class="btn btn-ghost btn-sm" id="btn-theory" onclick="setMode('theory')">📖 Теория</button>
    <button class="btn btn-ghost btn-sm" id="btn-solutions" onclick="setMode('solutions')">✅ Решения</button>
    <button class="btn btn-present btn-sm" id="btn-present" onclick="enterPresent()" title="Показать тему, план, конспект и ключевые слова на весь экран">🖥 Презентация</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">30 модулей курса</div>
    <div class="module-list" id="module-list"></div>
  </aside>
  <main class="main" id="main-content"></main>
</div>

<!-- PRESENTATION OVERLAY -->
<div id="present-overlay">
  <div class="present-bar">
    <div class="title" id="present-title">Модуль</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="exitPresent()">✕ Закрыть (Esc)</button>
    </div>
  </div>
  <div class="present-body" id="present-body"></div>
</div>

<script>
const MODULES = [
{
  id:1, name:"Code City", emoji:"🏙️", skill:"print",
  theme:"Функция print() — вывод информации на экран",
  keywords:["print","вывод","строка","кавычки","число","консоль"],
  plan:["Что такое команда print и зачем она нужна","Вывод текста (строк) в кавычках","Вывод чисел без кавычек","Несколько команд print подряд","Типичные ошибки начинающих"],
  theory:`
<p>В Code City мы учимся «говорить» с компьютером. Команда <span class="term-fn">print()</span> выводит данные в <span class="term">консоль</span>. Без неё программа молчит — это первая и самая частая команда в Python.</p>
<div class="callout idea"><span class="term-type">Строку</span> (текст) пишем в <span class="term-op">кавычках</span>: <code>print("Hello")</code>. <span class="term-type">Числа</span> — без кавычек: <code>print(42)</code>. <span class="term-kw">Скобки</span> обязательны.</div>
<h3>Несколько выводов</h3>
<div class="code-block">print("Python")
print("Quest")
print(2025)</div>
<p>Каждый вызов <span class="term-fn">print</span> печатает на <span class="term">новой строке</span>. Программа выполняется <span class="term-kw">сверху вниз</span> — порядок команд = порядок вывода.</p>
<p>Можно передать несколько значений через запятую: <code>print("Hi", 42)</code> — они разделятся пробелом.</p>
<div class="callout warn">Частые ошибки: забытые кавычки у текста, кавычки у числа, пропущенные скобки → <span class="term-err">SyntaxError</span>.</div>`,
  solutions:[
    {id:1,title:"Первый сигнал",diff:"easy",obj:"Выведи: Hello",code:`print("Hello")`,note:"Одна команда print со строкой в кавычках."},
    {id:2,title:"Приветствие города",diff:"easy",obj:"Выведи: Welcome to Code City",code:`print("Welcome to Code City")`,note:""},
    {id:3,title:"Двойной сигнал",diff:"easy",obj:"Python, затем Quest",code:`print("Python")\nprint("Quest")`,note:"Две отдельные команды."},
    {id:4,title:"Числовой маяк",diff:"easy",obj:"Выведи число 42",code:`print(42)`,note:"Число без кавычек."},
    {id:5,title:"Эхо имени",diff:"easy",obj:"Выведи: Coder",code:`print("Coder")`,note:""},
    {id:6,title:"Тройной код",diff:"medium",obj:"Open / The / Gate",code:`print("Open")\nprint("The")\nprint("Gate")`,note:"Порядок важен."},
    {id:7,title:"Секретный пароль",diff:"medium",obj:"PASS-777",code:`print("PASS-777")`,note:""},
    {id:8,title:"Координаты",diff:"medium",obj:"10, затем 20",code:`print(10)\nprint(20)`,note:""},
    {id:9,title:"Сообщение боссу",diff:"medium",obj:"Ready",code:`print("Ready")`,note:""},
    {id:10,title:"Мультисигнал",diff:"medium",obj:"A B C D",code:`print("A")\nprint("B")\nprint("C")\nprint("D")`,note:""},
    {id:11,title:"Точный протокол",diff:"hard",obj:"START-OK-END одной командой",code:`print("START-OK-END")`,note:""},
    {id:12,title:"Числовой код доступа",diff:"hard",obj:"100 200 300",code:`print(100)\nprint(200)\nprint(300)`,note:""},
    {id:13,title:"Финальный сигнал",diff:"hard",obj:"Code City Online",code:`print("Code City Online")`,note:""},
    {id:14,title:"BOSS: Страж терминала",diff:"boss",obj:"Hello / Python / 42 / Ready",code:`print("Hello")\nprint("Python")\nprint(42)\nprint("Ready")`,note:"Строки и число."},
    {id:15,title:"BOSS: Архитектор сигнала",diff:"boss",obj:"Quest / Infinity / 2025",code:`print("Quest")\nprint("Infinity")\nprint(2025)`,note:""},
    {id:16,title:"Свободный привет",diff:"easy",obj:"Приветствие со словом Hero",code:`print("Hero")`,note:"Любая строка с Hero."},
    {id:17,title:"Двойной вывод",diff:"medium",obj:"Start и Finish",code:`print("Start")\nprint("Finish")`,note:""},
    {id:18,title:"Число + текст",diff:"medium",obj:"99 затем OK",code:`print(99)\nprint("OK")`,note:""},
    {id:19,title:"Полный лог",diff:"hard",obj:"Python, Quest, Infinity",code:`print("Python")\nprint("Quest")\nprint("Infinity")`,note:""},
    {id:20,title:"BOSS CODE: Финал Code City",diff:"boss",obj:"Hello, Python, 42, Ready",code:`print("Hello")\nprint("Python")\nprint(42)\nprint("Ready")`,note:"Режим свободного кода."}
  ]
},
{
  id:2, name:"Variable Valley", emoji:"🌄", skill:"variables",
  theme:"Переменные — хранение и использование данных",
  keywords:["переменная","присваивание","=","имя","значение","перезапись"],
  plan:["Что такое переменная","Создание: имя = значение","Вывод через print","Перезапись значения","Правила имён"],
  theory:`
<p><span class="term">Переменная</span> — именованная ячейка памяти. Создаётся так: <code>name = "Alex"</code>. Знак <span class="term-op">=</span> здесь значит «положить значение», а не «равно» из математики.</p>
<div class="callout idea">Имя переменной — <span class="term-kw">без кавычек</span>. При выводе тоже: <code>print(name)</code>, а не <code>print("name")</code> (иначе напечатается слово name).</div>
<div class="code-block">name = "Alex"
print(name)
age = 13
print(age)
score = 0
score = 100
print(score)</div>
<p>Значение можно <span class="term">перезаписать</span> сколько угодно раз — побеждает последнее присваивание. Давайте понятные имена: <code>hero</code>, <code>score</code>, а не <code>x1</code>.</p>
<div class="callout warn">Сначала создайте переменную, потом используйте. Иначе — <span class="term-err">NameError</span>.</div>`,
  solutions:[
    {id:1,title:"Первая переменная",diff:"easy",obj:'name = "Alex", print(name)',code:`name = "Alex"\nprint(name)`,note:""},
    {id:2,title:"Числовая ячейка",diff:"easy",obj:"age = 13, print(age)",code:`age = 13\nprint(age)`,note:""},
    {id:3,title:"Две переменные",diff:"easy",obj:"x=5, y=10, оба print",code:`x = 5\ny = 10\nprint(x)\nprint(y)`,note:""},
    {id:4,title:"Перезапись",diff:"easy",obj:"score 0→100, print",code:`score = 0\nscore = 100\nprint(score)`,note:"Последнее присваивание побеждает."},
    {id:5,title:"Имя героя",diff:"easy",obj:'hero = "Nova"',code:`hero = "Nova"\nprint(hero)`,note:""},
    {id:6,title:"Три значения",diff:"medium",obj:"Три переменные и вывод",code:`a = 1\nb = 2\nc = 3\nprint(a)\nprint(b)\nprint(c)`,note:""},
    {id:7,title:"Город и ранг",diff:"medium",obj:"Две строковые переменные",code:`city = "Code City"\nrank = "Novice"\nprint(city)\nprint(rank)`,note:""},
    {id:8,title:"Счётчик",diff:"medium",obj:"Несколько перезаписей",code:`count = 0\ncount = 1\ncount = 2\nprint(count)`,note:""},
    {id:9,title:"Позывной",diff:"medium",obj:'callsign = "Alpha"',code:`callsign = "Alpha"\nprint(callsign)`,note:""},
    {id:10,title:"Код доступа",diff:"medium",obj:"code = 777",code:`code = 777\nprint(code)`,note:""},
    {id:11,title:"Статус",diff:"hard",obj:"offline→sync→online",code:`status = "offline"\nstatus = "sync"\nstatus = "online"\nprint(status)`,note:""},
    {id:12,title:"Координаты",diff:"hard",obj:"x и y",code:`x = 10\ny = 20\nprint(x)\nprint(y)`,note:""},
    {id:13,title:"Герой и уровень",diff:"hard",obj:"Строка + число",code:`hero = "Nova"\nlevel = 2\nprint(hero)\nprint(level)`,note:""},

elif score >= 70:

else:

  theory:`
<p><span class="term-fn">print</span> показывает значение <span class="term">человеку</span>. <span class="term-kw">return</span> отдаёт значение <span class="term">программе</span>. После <span class="term-kw">return</span> функция сразу завершается — код ниже не выполнится.</p>
<div class="callout idea">Результат можно сохранить: <code>r = add(2, 3)</code> или сразу вывести: <code>print(add(2, 3))</code>.</div>
<div class="code-block">def add(a, b):
    return a + b
result = add(2, 3)
print(result)
print(add(10, 20))</div>
<p>Без <span class="term-kw">return</span> функция вернёт <span class="term-type">None</span>. Несколько <span class="term-kw">return</span> в разных ветках <span class="term-kw">if</span> — нормальная практика (досрочный выход).</p>`,

print(n)</div>`,

  theory:`
<p><span class="term">Рекурсия</span> — когда функция вызывает <span class="term-kw">саму себя</span>. Обязателен <span class="term">базовый случай</span> (условие остановки), иначе будет <span class="term-err">RecursionError</span>.</p>
<div class="callout idea">Сначала продумайте самый простой случай (<code>n ≤ 1</code>), затем — как свести задачу к меньшей: <code>fact(n) = n * fact(n-1)</code>.</div>
<div class="code-block">def fact(n):
    if n <= 1:
        return 1
    return n * fact(n - 1)
print(fact(5))

def countdown(n):
    if n == 0:
        return
    print(n)
    countdown(n - 1)</div>
<p>Каждый вызов кладётся в <span class="term">стек</span>. Слишком глубокая рекурсия переполняет стек. Для многих задач цикл понятнее и безопаснее — рекурсию выбирайте, когда задача «естественно» делится на подзадачи.</p>`,
  solutions:[
    {id:1,title:"Факториал 5",diff:"medium",obj:"120",code:`def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)\nprint(fact(5))`,note:""},
    {id:2,title:"Факториал 3",diff:"easy",obj:"6",code:`def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)\nprint(fact(3))`,note:""},

    {id:4,title:"down",diff:"medium",obj:"2 1 0",code:`def down(n):\n    if n < 0:\n        return\n    print(n)\n    down(n - 1)\ndown(2)`,note:""},

    {id:6,title:"up",diff:"hard",obj:"1 2 3",code:`def up(n):\n    if n == 0:\n        return\n    up(n - 1)\n    print(n)\nup(3)`,note:"Сначала рекурсия, потом print"},

let currentId = null;
let mode = "theory";

function renderSidebar() {
  document.getElementById("module-list").innerHTML = MODULES.map(m => `
    <div class="mod-item ${currentId === m.id ? "active" : ""}" onclick="selectModule(${m.id})" role="button" tabindex="0">
      <div class="mod-num">${m.id}</div>
      <div class="mod-info">
        <div class="mod-name">${m.emoji} ${m.name}</div>
        <div class="mod-theme">${m.theme.split("—")[0].trim()}</div>
      </div>
    </div>`).join("");
}

function showWelcome() {
  currentId = null;
  mode = "theory";
  updateModeButtons();
  renderSidebar();
  document.getElementById("main-content").innerHTML = `
    <div class="welcome">
      <div style="font-size:2.6rem;margin-bottom:6px">🚀</div>
      <h1>Python Quest · Учебник</h1>
      <p>30 модулей · теория · полные решения · <strong>режим презентации</strong> на большой экран.</p>
      <p style="font-size:.88rem">Выберите модуль → «Теория» или «Решения». Кнопка <strong>🖥 Презентация</strong> показывает только тему, план, ключевые слова и конспект на весь экран.</p>
      <div class="welcome-grid">
        ${MODULES.slice(0, 12).map(m => `
          <div class="w-card" onclick="selectModule(${m.id})">
            <div class="emoji">${m.emoji}</div>
            <h3>${m.id}. ${m.name}</h3>
            <span>${m.skill}</span>
          </div>`).join("")}
      </div>
      <p style="margin-top:16px;font-size:.82rem;color:var(--muted)">Ещё ${MODULES.length - 12} модулей — в боковой панели</p>
    </div>`;
}

function selectModule(id) {
  currentId = id;
  renderSidebar();
  renderModule();
  document.querySelector(".main").scrollTop = 0;
}

function setMode(m) {
  mode = m;
  updateModeButtons();
  if (currentId) renderModule();
}

function updateModeButtons() {
  document.getElementById("btn-theory").classList.toggle("active", mode === "theory");
  document.getElementById("btn-solutions").classList.toggle("active", mode === "solutions");
}

function renderModule() {
  const m = MODULES.find(x => x.id === currentId);
  if (!m) return showWelcome();

  const theoryHtml = `
    <div class="section"><h2>📌 Тема</h2><p style="font-size:1.02rem;font-weight:600">${m.theme}</p></div>
    <div class="section"><h2>🗺 План</h2><ol class="plan-list">${m.plan.map(p => `<li><span>${p}</span></li>`).join("")}</ol></div>
    <div class="section"><h2>🔑 Ключевые слова</h2><div class="keywords">${m.keywords.map(k => `<span class="kw">${k}</span>`).join("")}</div></div>
    <div class="section"><h2>📖 Конспект</h2>${m.theory}</div>`;

  const solutionsHtml = `
    <div class="section">
      <h2>✅ Решения · ${m.name} <span style="font-size:.8rem;color:var(--muted);font-weight:500">(${m.solutions.length} задач)</span></h2>
      <p style="color:var(--muted);margin-bottom:12px;font-size:.84rem">Сначала решите сами в Python Quest, затем сверьте. Клик по карточке — открыть код.</p>
      ${m.solutions.map(s => `
        <div class="sol-card" id="sol-${m.id}-${s.id}">
          <div class="sol-head" onclick="toggleSol(${m.id},${s.id})">
            <div>
              <div class="sol-title">Миссия ${s.id}. ${s.title}</div>
              <div class="sol-meta">${escapeHtml(s.obj)}</div>
            </div>
            <span class="diff ${s.diff}">${s.diff}</span>
          </div>
          <div class="sol-body">
            <div class="sol-obj"><strong>Цель:</strong> ${escapeHtml(s.obj)}</div>
            <div class="code-block"><span class="label">решение</span>${escapeHtml(s.code)}</div>
            ${s.note ? `<div class="sol-note">💡 ${escapeHtml(s.note)}</div>` : ""}
          </div>
        </div>`).join("")}
    </div>`;

  document.getElementById("main-content").innerHTML = `
    <div class="mod-header">
      <div class="badge">Модуль ${m.id} · ${m.skill}</div>
      <h1>${m.emoji} ${m.name}</h1>
      <div class="sub">${m.theme}</div>
    </div>
    <div class="tabs">
      <div class="tab ${mode === "theory" ? "active" : ""}" onclick="setMode('theory')">📖 Теория и план</div>
      <div class="tab ${mode === "solutions" ? "active" : ""}" onclick="setMode('solutions')">✅ Решения (${m.solutions.length})</div>
    </div>
    <div class="panel ${mode === "theory" ? "active" : ""}">${theoryHtml}</div>
    <div class="panel ${mode === "solutions" ? "active" : ""}">${solutionsHtml}</div>
    <div class="footer-note">Python Quest Infinity · Учебник · Для учеников и учителей</div>`;
}

function toggleSol(mid, sid) {
  const el = document.getElementById(`sol-${mid}-${sid}`);
  if (el) el.classList.toggle("open");
}

function escapeHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ===== PRESENTATION MODE ===== */
function enterPresent() {
  if (!currentId) {
    alert("Сначала выберите модуль в боковой панели.");
    return;
  }
  const m = MODULES.find(x => x.id === currentId);
  if (!m) return;

  document.getElementById("present-title").textContent = `${m.emoji} Модуль ${m.id}. ${m.name}`;
  document.getElementById("present-body").innerHTML = `
    <div class="p-card p-theme">
      <h2>📌 Тема</h2>
      <div class="theme-text">${m.theme}</div>
    </div>
    <div class="p-left">
      <div class="p-card p-plan">
        <h2>🗺 План</h2>
        <ol class="plan-list">${m.plan.map(p => `<li><span>${p}</span></li>`).join("")}</ol>
      </div>
      <div class="p-card p-kw">
        <h2>🔑 Ключевые слова</h2>
        <div class="keywords">${m.keywords.map(k => `<span class="kw">${k}</span>`).join("")}</div>
      </div>
    </div>
    <div class="p-card p-conspect">
      <h2>📖 Конспект</h2>
      <div class="text">${m.theory}</div>
    </div>`;

  const ov = document.getElementById("present-overlay");
  ov.classList.add("active");
  // Try fullscreen
  try {
    if (ov.requestFullscreen) ov.requestFullscreen().catch(() => {});
    else if (ov.webkitRequestFullscreen) ov.webkitRequestFullscreen();
  } catch (_) {}
}

function exitPresent() {
  const ov = document.getElementById("present-overlay");
  ov.classList.remove("active");
  try {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch (_) {}
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") exitPresent();
  if (e.key === "p" && (e.ctrlKey || e.metaKey) && currentId) {
    e.preventDefault();
    enterPresent();
  }
});

renderSidebar();
showWelcome();
updateModeButtons();
</script>
</body>
</html>
